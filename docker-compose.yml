version: '3.8'

services:
  neo4j:
    image: neo4j:5.18.0-community
    container_name: welfare_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/welfarepassword123
      - NEO4J_PLUGINS=["apoc"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p welfarepassword123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  layer1-ingestion:
    build:
      context: ./layer1-ingestion
      dockerfile: Dockerfile
    container_name: welfare_layer1
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  layer2-semantic-extraction:
    build:
      context: ./layer2-semantic-extraction
      dockerfile: Dockerfile
    container_name: welfare_layer2
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - GROQ_API_KEY=${GROQ_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8002/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  layer3-reasoning-engine:
    build:
      context: ./layer3-reasoning-engine
      dockerfile: Dockerfile
    container_name: welfare_layer3
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=welfarepassword123
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8003/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  layer4-delivery:
    build:
      context: ./layer4-delivery/layer4-service
      dockerfile: Dockerfile
    container_name: welfare_layer4
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8004/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: welfare_gateway
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    depends_on:
      - layer1-ingestion
      - layer2-semantic-extraction
      - layer3-reasoning-engine
      - layer4-delivery
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: welfare_dashboard
    ports:
      - "8501:8501"
    environment:
      - GATEWAY_URL=http://gateway:8000
    depends_on:
      - gateway

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: welfare_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://gateway:8000
    depends_on:
      - gateway

